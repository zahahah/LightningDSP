name: Update KernelSU stable module feed

on:
  release:
    types: [published]

permissions:
  contents: write

# Serialize feed updates so separate release events cannot race to replace the stable channel.
concurrency:
  group: lightningdsp-stable-module-feed
  cancel-in-progress: false

jobs:
  update-feed:
    if: ${{ github.event.release.draft == false && github.event.release.prerelease == false }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stable branch
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate latest stable release and generate feed
        run: python3 tools/update_stable_feed.py

      - name: Publish changed stable metadata
        run: |
          if git diff --quiet -- update.json; then
            echo "Stable feed already matches the release"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "Keep KernelSU updates aligned with the stable module release" \
            -m "The stable update feed is generated only after the published latest release, tagged module metadata, and the module.prop inside its trusted ZIP asset agree. Release-event concurrency prevents races and the generator rejects draft, prerelease, beta, stale, oversized, or mismatched metadata." \
            -m "Confidence: high" \
            -m "Scope-risk: narrow" \
            -m "Tested: tools/test_stable_update_feed.py" \
            -m "Not-tested: GitHub branch protection and live release-event permissions" \
            -m "Directive: Keep the feed on master; never copy experimental module.prop values into it"
          git fetch origin master
          if ! git merge-base --is-ancestor origin/master HEAD; then
            echo "master advanced during feed generation; refusing a non-fast-forward update"
            exit 1
          fi
          git push origin HEAD:master
