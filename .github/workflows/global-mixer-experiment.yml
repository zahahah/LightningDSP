name: Global mixer experiment artifacts

on:
  push:
    branches: [global-output-experiment]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mixer-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    if: github.repository == 'zahahah/LightningDSP' && github.ref == 'refs/heads/global-output-experiment'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Host regression tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -v
      - name: Shell syntax
        run: |
          for file in *.sh common/*.sh tools/audio-policy-probe.sh; do
            sh -n "$file" || exit 1
          done
      - name: Verify and package the signed candidate
        run: |
          export LDSP_READELF="$(command -v llvm-readelf || command -v readelf)"
          python3 tools/package_lightningdsp.py
          cp common/files/LightningDSP.apk dist/LightningDSP-1.7.1-mixers-test-1.apk
          cp docs/all-mixers-test.md dist/TEST-NOTES.md
          cd dist
          sha256sum -c LightningDSP-v6.7.1-mixers-test-1.zip.sha256
          sha256sum LightningDSP-1.7.1-mixers-test-1.apk LightningDSP-v6.7.1-mixers-test-1.zip > SHA256SUMS.txt
      - name: Verify embedded APK equals standalone
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          root = Path('dist')
          with ZipFile(root / 'LightningDSP-v6.7.1-mixers-test-1.zip') as archive:
              assert archive.read('common/files/LightningDSP.apk') == (root / 'LightningDSP-1.7.1-mixers-test-1.apk').read_bytes()
          PY
      - name: Upload signed experimental APK, module and provenance
        uses: actions/upload-artifact@v4
        with:
          name: LightningDSP-mixers-test-1-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/LightningDSP-1.7.1-mixers-test-1.apk
            dist/LightningDSP-v6.7.1-mixers-test-1.zip
            dist/LightningDSP-v6.7.1-mixers-test-1.zip.sha256
            dist/LightningDSP-v6.7.1-mixers-test-1.zip.json
            dist/SHA256SUMS.txt
            dist/TEST-NOTES.md
